name: CI

on:
  # Push — только в main. Для остальных веток прогон даёт PR-триггер:
  # иначе на один и тот же код CI запускался бы дважды.
  push:
    branches: [main]
  pull_request:

# Новый push в ту же ветку делает предыдущий прогон бессмысленным.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Упавшая версия Node не должна скрывать результат другой.
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      # Node ставится первым, чтобы pnpm работал на версии из матрицы,
      # а не на системном Node раннера.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Версию pnpm берёт из packageManager в package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Сборку dist перед тестами делает test/build.ts.
      - run: pnpm test
