name: Release

# release-please читает conventional commits в main и держит открытым
# Release PR: следующая версия + CHANGELOG. Мерж этого PR создаёт тег и
# GitHub Release, а job publish отправляет пакет в npm на подтверждение.
on:
  push:
    branches: [main]
  # Повторная публикация уже созданного релиза — например, если publish
  # упал после того, как release-please поставил тег.
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v0.2.0
        required: true

# Два релиза подряд не должны публиковаться наперегонки — второй ждёт.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    needs: release-please
    # При ручном запуске release-please пропущен, поэтому без !cancelled()
    # publish пропустился бы вслед за ним.
    if: >-
      !cancelled() && !failure() && (
        needs.release-please.outputs.release_created == 'true'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm доверяет этому workflow по OIDC-токену
      # GitHub, поэтому токен npm в секретах не нужен. Имя файла
      # (release.yml) указано в настройках пакета на npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      # Node 24 — в нём npm 11.16+, где есть npm stage.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Те же проверки, что в CI, на том коммите, который уходит в npm.
      - run: pnpm test

      # Версия уходит в npm на подтверждение, а не сразу пользователям:
      # опубликует её мейнтейнер с 2FA — `npm stage approve` или на
      # npmjs.com. prepack сам собирает dist.
      - run: npm stage publish --access public --provenance
